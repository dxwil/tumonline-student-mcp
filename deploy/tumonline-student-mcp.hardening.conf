# Optional drop-in for a Proxmox LXC with nesting=1, or a privileged container.
# These settings need user namespaces and fail in a default unprivileged LXC.
# Install only after `features: nesting=1` is set and the container has been restarted:
#   install -D -m 644 deploy/tumonline-student-mcp.hardening.conf \
#     /etc/systemd/system/tumonline-student-mcp.service.d/hardening.conf
#   systemctl daemon-reload && systemctl restart tumonline-student-mcp
[Service]
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictNamespaces=yes
